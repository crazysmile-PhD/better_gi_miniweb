[project]
name = "better-gi-miniweb"
version = "0.1.0"
description = "Flask dashboard and webhook receiver for BetterGI notifications."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Flask>=3.1.3,<3.2",
    "Flask-SQLAlchemy>=3.1.1,<3.2",
    "SQLAlchemy>=2.0.49,<2.1",
    "gevent>=26.4.0,<27.0",
    "Werkzeug>=3.1.8,<3.2",
    "Jinja2>=3.1.6,<3.2",
    "MarkupSafe>=3.0.3,<3.1",
    "itsdangerous>=2.2.0,<2.3",
    "click>=8.3.3,<8.4",
    "alembic>=1.17.2,<1.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
