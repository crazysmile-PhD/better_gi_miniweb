<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}BetterGI 信息流{% endblock %}</title>
    <style>
        .container_error {
            width: 100%;
            height: 100%;
            border: 1px solid #ccc;
            overflow-y: auto;
            box-sizing: border-box;
        }
        textarea {
            width: 100%;
            height: 100%;
            resize: none;
            border: none;
            outline: none;
            font-size: 16px;
            padding: 5px;
            box-sizing: border-box;
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_v2.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% block head_extra %}{% endblock %}
</head>
<body>
<main class="min-h-screen bg-background">
    <header class="fixed top-0 left-0 right-0 bg-background z-10 border-b">
        <div class="container mx-auto py-4 text-center">
            <h1 class="text-2xl font-bold">BetterGI 信息流</h1>
            <a
                href="https://github.com/Because66666/better_gi_miniweb.git"
                class="text-sm text-blue-500 hover:text-blue-700 transition-colors">开源项目地址</a>
        </div>
    </header>
    {% block content %}{% endblock %}
</main>
</body>
</html>
