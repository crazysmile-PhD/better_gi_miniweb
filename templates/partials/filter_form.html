<form method="get" class="rounded-lg border bg-card text-card-foreground shadow-sm w-full max-w-md mx-auto mb-4 p-4">
    <label>搜尋 <input type="search" name="q" value="{{ filters.q }}" placeholder="event / message / result"></label>
    <label>結果 <input type="text" name="result" value="{{ filters.result }}" placeholder="success"></label>
    <label>起日 <input type="date" name="date_from" value="{{ request.args.get('date_from', '') }}"></label>
    <label>迄日 <input type="date" name="date_to" value="{{ request.args.get('date_to', '') }}"></label>
    <label>每頁 <input type="number" min="1" max="100" name="per_page" value="{{ pagination.per_page }}"></label>
    <label>刷新秒數 <input type="number" min="0" name="refresh" value="{{ refresh }}"></label>
    <button type="submit">套用</button>
    {% for error in filter_errors %}<p class="text-red-500">{{ error }}</p>{% endfor %}
</form>
